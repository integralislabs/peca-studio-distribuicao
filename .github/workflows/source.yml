name: Public source regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: codigo-fonte
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packaging/requirements-integralis.txt
      - run: python -m unittest discover -s tests -p "test_integralis_*.py" -v
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codigo-fonte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify snapshot integrity and excluded runtime data
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root = Path('codigo-fonte')
          manifest = json.loads((root / 'SOURCE-MANIFEST.json').read_text('utf-8'))
          expected = {record['path'] for record in manifest['snapshotFiles']}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected | {'README.md', 'SOURCE-MANIFEST.json'}
          for record in manifest['snapshotFiles']:
              p = root / record['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == record['sha256'], record['path']
              assert not any(part in ('.git', '.local', '.runtime', 'workspace-data', '__pycache__') for part in p.parts)
              assert p.name != '.env' and not p.name.startswith('.env.')
          print('Source snapshot hashes and inventory verified.')
